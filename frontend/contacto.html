<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Tienda — Contacto</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="navbar">
    <div class="contenedor nav-contenido">
      <a href="index.html" class="logo"> Mi<strong>Tienda</strong></a>
      <nav class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="index.html#productos">Productos</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </div>
  </header>

  <main class="contenedor" id="inicio">
    <div class="encabezado-principal">
      <h1>Contacto y Mensajes</h1>
      <p>Déjanos tu mensaje y aparecerá en la lista inferior</p>
    </div>

    <div class="panel-tienda">

      <section class="tarjeta" id="registro">
        <h2>Enviar Mensaje</h2>

        <form id="formularioContacto">
          <div class="campo">
            <label for="nombreContacto">Nombre:</label>
            <input type="text" id="nombreContacto" placeholder="Tu nombre" required />
          </div>

          <div class="campo">
            <label for="asuntoContacto">Asunto:</label>
            <input type="text" id="asuntoContacto" placeholder="Motivo del mensaje" required />
          </div>

          <div class="campo">
            <label for="correoContacto">Correo:</label>
            <input type="email" id="correoContacto" placeholder="tu@correo.com" required />
          </div>

          <div class="campo">
            <label for="mensajeContacto">Mensaje:</label>
            <textarea id="mensajeContacto" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
          </div>

          <div class="acciones-form">
            <button type="submit" class="btn btn-guardar">Enviar Mensaje</button>
          </div>
        </form>
      </section>

      <section class="tarjeta" id="productos">
        <h2>Mensajes Recibidos</h2>
        <div id="listaMensajes" class="lista-productos">
        
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="contenedor footer-contenido">
      <p>&copy; 2026 Mi Tienda — Proyecto Formativo con Node.js, Express y MySQL.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>

</html>
